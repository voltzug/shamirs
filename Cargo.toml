[package]
name = "shamirs"
version = "0.7.0"
authors = ["voltzug"]
description = "Small, and secure Shamir's Secret Sharing"
repository = "https://github.com/voltzug/shamirs"
readme = "README.md"
keywords = ["shamir", "secret", "sharing", "share", "cryptography"]
categories = ["algorithms", "cryptography", "mathematics"]
license = "MIT"
edition = "2021"

[features]
default = ["std", "zeroize_memory"]
std = ["rand/std", "rand/std_rng"]
fuzzing = ["std", "arbitrary"]
zeroize_memory = ["zeroize"]

[dependencies]
rand = { version = "0.8", default-features = false }
hashbrown = "0.15.5"
arbitrary = { version = "0.4.7", features = ["derive"], optional = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"], optional = true }

[dev-dependencies]
criterion = "0.3"
rand_chacha = "0.3"

[[bench]]
name = "benchmarks"
harness = false
